name: Update papers

on:
  schedule:
    - cron: '17 1 * * *' # 09:17 Asia/Shanghai
  workflow_dispatch:
    inputs:
      days:
        description: 'Optional backfill window in days (blank = incremental)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'daily_arxiv.py'
      - 'config.json'
      - 'tests/**'
      - 'docs/index.html'
      - 'docs/style.css'
      - 'docs/app.js'
      - '.github/workflows/daily.yml'

permissions:
  contents: read

concurrency:
  group: paper-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect papers
        env:
          BACKFILL_DAYS: ${{ inputs.days }}
        run: |
          if [ -n "$BACKFILL_DAYS" ]; then
            python daily_arxiv.py --days "$BACKFILL_DAYS"
          else
            python daily_arxiv.py
          fi
      - name: Commit generated feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/papers.json docs/papers.json docs/feed.xml papers/
          if ! git diff --cached --quiet; then
            git commit -m 'Update Efficient AI paper feed'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy paper browser
        id: deployment
        uses: actions/deploy-pages@v4
